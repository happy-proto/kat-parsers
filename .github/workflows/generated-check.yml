name: Generated Check

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tree-sitter --version
      - run: pnpm exec cargo run -p xtask -- sync --locked --check
      - run: pnpm exec cargo test -p xtask -- --include-ignored
      - run: pnpm exec cargo run -p xtask -- generate --force
      - run: git diff --exit-code
