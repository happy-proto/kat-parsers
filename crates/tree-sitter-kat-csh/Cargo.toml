[package]
name = "tree-sitter-kat-csh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pre-generated tree-sitter parser crate for csh used by kat"
authors = ["DCjanus <DCjanus@dcjanus.com>"]
build = "build.rs"
include = ["build.rs", "src/lib.rs", "vendor/**"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
tree-sitter = "0.27.1"

[dependencies]
tree-sitter-language = "0.1.7"
kat-parser-runtime = { path = "../kat-parser-runtime" }

[build-dependencies]
kat-parser-common = { path = "../kat-parser-common" }
