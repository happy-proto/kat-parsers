language = "vimhelp"
crate = "tree-sitter-kat-parsers"
reason_category = "当前继续 vendored，主要是为了沿用上游 grammar 源和仓库内 query 集成资产"

[copied]
files = [
  "grammar.js",
]

[generated]
command = "cargo run -p xtask -- generate vimhelp"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/neovim/tree-sitter-vimdoc"
revision = "f061895a0eff1d5b90e4fb60d21d87be3267031a"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
