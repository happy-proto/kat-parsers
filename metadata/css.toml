language = "css"
crate = "tree-sitter-kat-parsers"
reason_category = "例外：parser 已迁移，但仍保留 vendored support asset"
reason = """虽然 CSS runtime 已迁到 crate-backed，但 `grammars/less/grammar.js` 和 `grammars/scss/grammar.js` 仍会在生成期直接 `require("../css/grammar.js")`，所以仓库里继续保留 `grammars/css/grammar.js` 这份最小 support asset。"""
upstream_repo = "https://github.com/tree-sitter/tree-sitter-css"
upstream_commit = "dda5cfc5722c429eaba1c910ca32c2c0c5bb1a3f"
upstream_version = "0.25.0"
license = "MIT"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate css"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-css.git"
revision = "dda5cfc5722c429eaba1c910ca32c2c0c5bb1a3f"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
