language = "tcl"
crate = "tree-sitter-kat-parsers"
reason_category = "当前继续 vendored，主要是为了沿用上游 grammar 源和仓库内 query 集成资产"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate tcl"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-tcl"
revision = "8f11ac7206a54ed11210491cee1e0657e2962c47"
reference = "HEAD"
patches = ["patches/tcl-snapshot.patch"]

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
