language = "solidity"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 solidity grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/JoranHonig/tree-sitter-solidity"
upstream_commit = "4e938a46c7030dd001bc99e1ac0f0c750ac98254"
upstream_version = "1.2.13"
upstream_crate = "tree-sitter-solidity"
license = "MIT"

[sync]
repository = "https://github.com/JoranHonig/tree-sitter-solidity.git"
revision = "4e938a46c7030dd001bc99e1ac0f0c750ac98254"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate solidity"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]
language = "solidity"
