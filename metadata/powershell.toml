language = "powershell"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 powershell grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/airbus-cert/tree-sitter-powershell"
upstream_commit = "d398441825243b00e317e87e1829b9d6a3e54ce0"
upstream_version = "0.26.4"
upstream_crate = "tree-sitter-powershell"
license = "MIT"

[sync]
repository = "https://github.com/airbus-cert/tree-sitter-powershell.git"
revision = "d398441825243b00e317e87e1829b9d6a3e54ce0"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate powershell"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "powershell"
