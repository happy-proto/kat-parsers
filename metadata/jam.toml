reason_category = "仓库内自维护 grammar"
reason = "公开 tree-sitter-jam crate 对应另一门同名编程语言；按 B2 官方语法独立实现 Jam 构建语言，供 Jamfile 源码高亮。"
reference_repo = "https://github.com/bfgroup/b2"
reference_commit = "4ca043f11b3b6de25bb268d5d874d714344074d9"
