language = "tsv"
crate = "tree-sitter-kat-parsers"
reason_category = "当前继续 vendored，主要是为了沿用上游 grammar 源和仓库内 query 集成资产"

[copied]
files = [
  "common/define-grammar.js",
  "grammar.js",
]

[generated]
command = "cargo run -p xtask -- generate tsv"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-csv"
revision = "f6bf6e35eb0b95fbadea4bb39cb9709507fcb181"
reference = "HEAD"
patches = ["patches/tsv-snapshot.patch"]

[sync.files]
"common/define-grammar.js" = "common/define-grammar.js"
"grammar.js" = "tsv/grammar.js"
