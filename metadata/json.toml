language = "json"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-json"
upstream_commit = "ee35a6ebefcef0c5c416c0d1ccec7370cfca5a24"
upstream_version = "0.24.8"
license = "MIT"

[copied]
files = ["grammar.js", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate json"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c"]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-json.git"
revision = "ee35a6ebefcef0c5c416c0d1ccec7370cfca5a24"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"LICENSE" = "LICENSE"
