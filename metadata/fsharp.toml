language = "fsharp"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留上游 F# grammar、scanner 与共享 scanner 头文件，并纳入统一 parser crate；scanner include 路径按本仓库的 vendor 布局调整。"
upstream_repo = "https://github.com/ionide/tree-sitter-fsharp"
upstream_commit = "aefd0c8741bdf3aeb827a228aa4a996a6536697e"
upstream_version = "0.3.12"
license = "MIT"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "common/scanner.h",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate fsharp"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/ionide/tree-sitter-fsharp.git"
revision = "aefd0c8741bdf3aeb827a228aa4a996a6536697e"
reference = "HEAD"
patches = ["patches/fsharp-scanner.patch"]

[sync.files]
"grammar.js" = "fsharp/grammar.js"
"scanner.c" = "fsharp/src/scanner.c"
"common/scanner.h" = "common/scanner.h"
"LICENSE" = "LICENSE"
