language = "regex"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 regex grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-regex"
upstream_commit = "b2ac15e27fce703d2f37a79ccd94a5c0cbe9720b"
upstream_version = "0.25.0"
upstream_crate = "tree-sitter-regex"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-regex.git"
revision = "b2ac15e27fce703d2f37a79ccd94a5c0cbe9720b"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate regex"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]
language = "regex"
