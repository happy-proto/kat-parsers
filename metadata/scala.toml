language = "scala"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 scala grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-scala"
upstream_commit = "b931fcc338390925eb893d70ad070033f5856ccf"
upstream_version = "0.26.2"
upstream_crate = "tree-sitter-scala"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-scala.git"
revision = "b931fcc338390925eb893d70ad070033f5856ccf"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate scala"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "scala"
