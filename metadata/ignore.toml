language = "ignore"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内有本地 grammar 或 scanner 改造，短期内不适合直接切回上游 crate"
reason = """本地重命名并调整成统一的 ignore-pattern runtime，供 `.gitignore`、`.dockerignore`、`.npmignore` 等文件共享。"""

[copied]
files = [
  "grammar.js",
]

[generated]
command = "cargo run -p xtask -- generate ignore"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/shunsambongi/tree-sitter-gitignore"
revision = "f4685bf11ac466dd278449bcfe5fd014e94aa504"
reference = "HEAD"
patches = ["patches/ignore-snapshot.patch"]

[sync.files]
"grammar.js" = "grammar.js"
