language = "kotlin"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter-grammars/tree-sitter-kotlin"
upstream_commit = "77dd60ea0a9003ce062c9728a513ffe1aaff8c82"
upstream_version = "1.1.0"
license = "MIT"

[copied]
files = ["grammar.js", "scanner.c", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate kotlin"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-kotlin.git"
revision = "77dd60ea0a9003ce062c9728a513ffe1aaff8c82"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
