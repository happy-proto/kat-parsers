language = "cabal"
crate = "tree-sitter-kat-parsers"
reason_category = "没有可用的 crates.io grammar crate"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate cabal"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/thomasvergne/tree-sitter-cabal"
revision = "1762ded13e5351c0bc662a2273d523b80d314b4e"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
