language = "ghostty"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内自维护 grammar"
reason = "依据 Ghostty 官方 LineIterator 与 Config.loadReader 独立设计，保留逐行 key/value 结构，不使用社区 tree-sitter-ghostty。"
reference_repo = "https://github.com/ghostty-org/ghostty"
reference_commit = "b1d9492cfa5d0d22c534a00e81bea623957113e7"
reference_files = ["src/cli/args.zig", "src/config/Config.zig"]
license = "MIT"

# The generator's copied list also describes repository-owned source inputs.
[copied]
files = ["grammar.js", "scanner.c"]

[generated]
command = "cargo run -p xtask -- generate ghostty"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
local = true
