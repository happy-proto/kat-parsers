language = "vim"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 vim grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter-grammars/tree-sitter-vim"
upstream_commit = "052279cd5e1d73b075640c64cef97e7bdcd32611"
upstream_version = "0.4.0"
upstream_crate = "tree-sitter-vim"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-vim.git"
revision = "052279cd5e1d73b075640c64cef97e7bdcd32611"
reference = "HEAD"
patches = ["patches/vim/cargo-source.patch"]

[sync.files]
"grammar.js" = "grammar.js"
"keywords.js" = "keywords.js"
"rules/autocmd.js" = "rules/autocmd.js"
"rules/command.js" = "rules/command.js"
"rules/edit.js" = "rules/edit.js"
"rules/highlight.js" = "rules/highlight.js"
"rules/syntax.js" = "rules/syntax.js"
"rules/utils.js" = "rules/utils.js"
"scanner.c" = "src/scanner.c"
"keywords.h" = "src/keywords.h"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "keywords.js",
  "rules/autocmd.js",
  "rules/command.js",
  "rules/edit.js",
  "rules/highlight.js",
  "rules/syntax.js",
  "rules/utils.js",
  "scanner.c",
  "keywords.h",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate vim"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "vim"
