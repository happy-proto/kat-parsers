language = "twig"
crate = "tree-sitter-kat-parsers"
reason_category = "没有可用的 crates.io grammar crate"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate twig"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/kaermorchen/tree-sitter-twig"
revision = "dac11024e40536d05c958d920139c310cbe86625"
reference = "HEAD"
patches = ["patches/twig-snapshot.patch"]

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
