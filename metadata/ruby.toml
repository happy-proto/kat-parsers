language = "ruby"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 ruby grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-ruby"
upstream_commit = "71bd32fb7607035768799732addba884a37a6210"
upstream_version = "0.23.1"
upstream_crate = "tree-sitter-ruby"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-ruby.git"
revision = "71bd32fb7607035768799732addba884a37a6210"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate ruby"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "ruby"
