language = "nginx"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 nginx grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/opa-oz/tree-sitter-nginx"
upstream_commit = "47ade644d754cce57974aac44d2c9450e823d4f4"
upstream_version = "1.0.1"
upstream_crate = "tree-sitter-nginx"
license = "MIT"

[sync]
repository = "https://github.com/opa-oz/tree-sitter-nginx.git"
revision = "47ade644d754cce57974aac44d2c9450e823d4f4"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate nginx"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "nginx"
