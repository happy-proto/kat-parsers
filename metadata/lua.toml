language = "lua"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter-grammars/tree-sitter-lua"
upstream_commit = "10fe0054734eec83049514ea2e718b2a56acd0c9"
upstream_version = "0.5.0"
license = "MIT"

[copied]
files = ["grammar.js", "scanner.c", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate lua"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-lua.git"
revision = "10fe0054734eec83049514ea2e718b2a56acd0c9"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE.md"
