language = "awk"
crate = "tree-sitter-kat-parsers"
reason_category = "当前继续 vendored，主要是为了沿用上游 grammar 源和仓库内 query 集成资产"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate awk"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/Beaglefoot/tree-sitter-awk"
revision = "34bbdc7cce8e803096f47b625979e34c1be38127"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
