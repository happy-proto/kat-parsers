language = "xml"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 xml grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
upstream_commit = "4b64dd3a03ec002258d6268d712fd93716d6ab57"
upstream_version = "0.7.0"
upstream_path = "xml"
upstream_crate = "tree-sitter-xml"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml.git"
revision = "4b64dd3a03ec002258d6268d712fd93716d6ab57"
reference = "HEAD"
patches = ["patches/xml/paths.patch"]

[sync.files]
"grammar.js" = "xml/grammar.js"
"common/common.mjs" = "common/common.mjs"
"scanner.c" = "xml/src/scanner.c"
"scanner.h" = "common/scanner.h"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "common/common.mjs",
  "scanner.c",
  "scanner.h",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate xml"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "xml"
