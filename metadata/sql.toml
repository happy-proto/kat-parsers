language = "sql"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 sql grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/derekstride/tree-sitter-sql"
upstream_commit = "7b51ecda191d36b92f5a90a8d1bc3faef1c7b8b8"
upstream_version = "0.3.11"
upstream_crate = "tree-sitter-sequel"
license = "MIT"

[sync]
repository = "https://github.com/derekstride/tree-sitter-sql.git"
revision = "7b51ecda191d36b92f5a90a8d1bc3faef1c7b8b8"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate sql"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "sql"
