language = "just"
crate = "tree-sitter-kat-parsers"
reason_category = "已有 crate，但仍依赖旧版 `tree-sitter`，暂时无法和当前 runtime共存"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate just"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/IndianBoy42/tree-sitter-just"
revision = "d9da862c156020c1a83d3c6ccdda32be6d8a5d4a"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
