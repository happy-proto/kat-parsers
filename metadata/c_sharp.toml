language = "c_sharp"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-c-sharp"
upstream_commit = "cac6d5fb595f5811a076336682d5d595ac1c9e85"
upstream_version = "0.23.5"
license = "MIT"

[copied]
files = ["grammar.js", "scanner.c", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate c_sharp"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp.git"
revision = "cac6d5fb595f5811a076336682d5d595ac1c9e85"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
