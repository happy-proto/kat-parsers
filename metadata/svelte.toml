language = "svelte"
crate = "tree-sitter-kat-parsers"
reason_category = "已有 crate，但仍依赖旧版 `tree-sitter`，暂时无法和当前 runtime共存"

[copied]
files = [
  "allocator.h",
  "ekstring.h",
  "grammar.js",
  "scanner.c",
  "tag.h",
  "uthash.h",
  "vc_vector.h",
]

[generated]
command = "cargo run -p xtask -- generate svelte"
outputs = [
  ".parser-inputs",
  "allocator.h",
  "ekstring.h",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
  "tag.h",
  "uthash.h",
  "vc_vector.h",
]

[sync]
repository = "https://github.com/Himujjal/tree-sitter-svelte"
revision = "60ea1d673a1a3eeeb597e098d9ada9ed0c79ef4b"
reference = "HEAD"

[sync.files]
"allocator.h" = "src/allocator.h"
"ekstring.h" = "src/ekstring.h"
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"tag.h" = "src/tag.h"
"uthash.h" = "src/uthash.h"
"vc_vector.h" = "src/vc_vector.h"
