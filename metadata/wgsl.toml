language = "wgsl"
crate = "tree-sitter-kat-parsers"
reason_category = "已有 crate，但仍依赖旧版 `tree-sitter`，暂时无法和当前 runtime共存"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate wgsl"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/mehmetoguzderin/tree-sitter-wgsl"
revision = "27ae4db1458d5ea7555300c9e93c6273723d420c"
reference = "HEAD"
patches = ["patches/wgsl-snapshot.patch"]

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
