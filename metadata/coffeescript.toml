language = "coffeescript"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/svkozak/tree-sitter-coffeescript"
upstream_commit = "3bb4dbd68ca926c76b3baadb529da4de3726ea37"
license = "MIT"

[copied]
files = [
  "grammar.js",
  "src/scanner.c",
  "LICENSE.txt",
]

[generated]
command = "cargo run -p xtask -- generate coffeescript"
outputs = [
  ".parser-inputs",
  "parser.c",
  "scanner.c",
  "grammar.json",
  "node-types.json",
]

[sync]
repository = "https://github.com/svkozak/tree-sitter-coffeescript"
revision = "3bb4dbd68ca926c76b3baadb529da4de3726ea37"
reference = "HEAD"
# 清理 CLI 0.27.1 确认冗余的冲突声明；parser 和 node-types 保持不变。
patches = ["patches/coffeescript-unused-conflicts.patch"]

[sync.files]
"grammar.js" = "grammar.js"
"src/scanner.c" = "src/scanner.c"
"LICENSE.txt" = "LICENSE.txt"
