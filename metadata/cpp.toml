language = "cpp"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-cpp"
upstream_commit = "f41e1a044c8a84ea9fa8577fdd2eab92ec96de02"
upstream_version = "0.23.4"
license = "MIT"
grammar_file = "grammar.json"

[generated]
command = "cargo run -p xtask -- generate cpp"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-cpp.git"
revision = "f41e1a044c8a84ea9fa8577fdd2eab92ec96de02"
reference = "HEAD"

[sync.files]
"grammar.json" = "src/grammar.json"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = ["grammar.json", "scanner.c", "LICENSE"]
