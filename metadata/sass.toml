language = "sass"
crate = "tree-sitter-kat-parsers"
reason_category = "没有可用的 crates.io grammar crate"

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate sass"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/bajrangCoder/tree-sitter-sass"
revision = "fb280c41b070657e4ff4d4e5e6eea6cb19efd9b8"
reference = "HEAD"
patches = ["patches/sass-snapshot.patch"]

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
