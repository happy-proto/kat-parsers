language = "markdown"
crate = "tree-sitter-kat-parsers"
reason_category = "已有 crate，但仍依赖旧版 `tree-sitter`，暂时无法和当前 runtime共存"

[copied]
files = [
  "common.js",
  "grammar.js",
  "html_entities.json",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate markdown"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-markdown"
revision = "a0a00f817d02412bd92c54d316f164d827b57b5c"
reference = "HEAD"
patches = ["patches/markdown-path.patch"]

[sync.files]
"common.js" = "common/common.js"
"grammar.js" = "tree-sitter-markdown/grammar.js"
"html_entities.json" = "common/html_entities.json"
"scanner.c" = "tree-sitter-markdown/src/scanner.c"
