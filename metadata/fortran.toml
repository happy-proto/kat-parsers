language = "fortran"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留上游 Fortran grammar 与 external scanner，并纳入统一 parser crate，避免 Kat 为该语言单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/stadelmanma/tree-sitter-fortran"
upstream_commit = "48593829df8a929bfe58528eedcf405171921005"
upstream_version = "0.6.0"
license = "MIT"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate fortran"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/stadelmanma/tree-sitter-fortran.git"
revision = "48593829df8a929bfe58528eedcf405171921005"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
