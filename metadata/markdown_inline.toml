language = "markdown_inline"
crate = "tree-sitter-kat-parsers"
reason_category = "已有 crate，但仍依赖旧版 `tree-sitter`，暂时无法和当前 runtime共存"
generator_support_files = [
  "../markdown/common.js",
  "../markdown/html_entities.json",
]

[copied]
files = [
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate markdown_inline"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-markdown"
revision = "a0a00f817d02412bd92c54d316f164d827b57b5c"
reference = "HEAD"
patches = ["patches/markdown-inline-path.patch"]

[sync.files]
"grammar.js" = "tree-sitter-markdown-inline/grammar.js"
"scanner.c" = "tree-sitter-markdown-inline/src/scanner.c"
