language = "varlink"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 varlink grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/bachorp/tree-sitter-varlink"
upstream_commit = "49c5cd8922f2707711d0ea127f1c5f4583bda493"
upstream_version = "0.6.1"
upstream_crate = "tree-sitter-varlink"
license = "MIT"

[sync]
repository = "https://github.com/bachorp/tree-sitter-varlink.git"
revision = "49c5cd8922f2707711d0ea127f1c5f4583bda493"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate varlink"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]
language = "varlink"
