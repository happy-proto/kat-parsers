language = "git_commit"
crate = "tree-sitter-kat-parsers"
reason_category = "没有可用的 crates.io grammar crate"

[copied]
files = [
  "grammar.js",
]

[generated]
command = "cargo run -p xtask -- generate git_commit"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/the-mikedavis/tree-sitter-git-commit"
revision = "5a50da19b3841ac51e9d483cd9c856a85232233d"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
