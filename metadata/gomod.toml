language = "gomod"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内有本地 grammar 或 scanner 改造，短期内不适合直接切回上游 crate"
reason = """当前沿用 vendored grammar 资产和本地 query 集成。"""

[copied]
files = [
  "grammar.js",
]

[generated]
command = "cargo run -p xtask -- generate gomod"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/camdencheek/tree-sitter-go-mod"
revision = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a"
reference = "HEAD"
patches = ["patches/gomod-snapshot.patch"]

[sync.files]
"grammar.js" = "grammar.js"
