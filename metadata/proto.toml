language = "proto"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内有本地 grammar 或 scanner 改造，短期内不适合直接切回上游 crate"
reason = """当前 runtime 依赖 vendored grammar 的节点结构和现有 query 约定。"""

[copied]
files = [
  "grammar.js",
]

[generated]
command = "cargo run -p xtask -- generate proto"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/mitchellh/tree-sitter-proto"
revision = "42d82fa18f8afe59b5fc0b16c207ee4f84cb185f"
reference = "HEAD"
patches = ["patches/proto-declarations.patch"]

[sync.files]
"grammar.js" = "grammar.js"
