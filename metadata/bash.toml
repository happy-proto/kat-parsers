language = "bash"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-bash"
upstream_commit = "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
upstream_version = "0.25.1"
license = "MIT"

[copied]
files = ["grammar.js", "scanner.c", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate bash"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-bash.git"
revision = "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
