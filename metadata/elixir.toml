language = "elixir"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/elixir-lang/tree-sitter-elixir"
upstream_commit = "e2d9e6e0e76b0c436fa48a0b8c32a031d0cbdf49"
upstream_version = "0.3.5"
license = "Apache-2.0"

[copied]
files = ["grammar.js", "scanner.c", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate elixir"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/elixir-lang/tree-sitter-elixir.git"
revision = "e2d9e6e0e76b0c436fa48a0b8c32a031d0cbdf49"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
