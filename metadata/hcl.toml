language = "hcl"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内有本地 grammar 或 scanner 改造，短期内不适合直接切回上游 crate"
reason = """沿用上游模块化 grammar，并保留 scanner 序列化缓冲区恰好写满时的边界处理。"""

[copied]
files = [
  "make_grammar.js",
  "grammar.js",
  "scanner.c",
]

[generated]
command = "cargo run -p xtask -- generate hcl"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-hcl"
revision = "fad991865fee927dd1de5e172fb3f08ac674d914"
reference = "HEAD"
patches = ["patches/hcl-serialization.patch"]

[sync.files]
"make_grammar.js" = "make_grammar.js"
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
