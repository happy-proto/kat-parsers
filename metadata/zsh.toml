language = "zsh"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 zsh grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/georgeharker/tree-sitter-zsh"
upstream_commit = "7a593401efb5418ffdedbe3c0e4c61c6d240166d"
upstream_version = "0.63.4"
upstream_crate = "tree-sitter-zsh"
license = "MIT"

[sync]
repository = "https://github.com/georgeharker/tree-sitter-zsh.git"
revision = "7a593401efb5418ffdedbe3c0e4c61c6d240166d"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate zsh"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "zsh"
