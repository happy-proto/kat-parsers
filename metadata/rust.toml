language = "rust"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 rust grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-rust"
upstream_commit = "77a3747266f4d621d0757825e6b11edcbf991ca5"
upstream_version = "0.24.2"
upstream_crate = "tree-sitter-rust"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-rust.git"
revision = "77a3747266f4d621d0757825e6b11edcbf991ca5"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate rust"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "rust"
