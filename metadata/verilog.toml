language = "verilog"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留上游 grammar 源并纳入统一 parser crate，避免 Kat 为该语言单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-verilog"
upstream_commit = "521b535e41a5acd2c6539a922d4649bbe8275110"
upstream_version = "1.0.3"
license = "MIT"

[copied]
files = [
  "grammar.js",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate verilog"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-verilog.git"
revision = "521b535e41a5acd2c6539a922d4649bbe8275110"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"LICENSE" = "LICENSE"
