language = "pgpass"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内自维护 grammar"
reason = "依据 PostgreSQL libpq 密码文件格式独立实现，保留五字段、逐行边界、通配符及反斜杠转义。"
reference_docs = "https://www.postgresql.org/docs/18/libpq-pgpass.html"
license = "MIT"

[copied]
files = ["grammar.js"]

[generated]
command = "cargo run -p xtask -- generate pgpass"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c"]

[sync]
local = true
