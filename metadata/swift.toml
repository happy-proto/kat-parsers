language = "swift"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 swift grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/alex-pinkus/tree-sitter-swift"
upstream_commit = "171fa3bc343233fe07f5e17205aaada33d778825"
upstream_version = "0.7.4"
upstream_crate = "tree-sitter-swift"
license = "MIT"

[sync]
repository = "https://github.com/alex-pinkus/tree-sitter-swift.git"
revision = "171fa3bc343233fe07f5e17205aaada33d778825"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate swift"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "swift"
