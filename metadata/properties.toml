language = "properties"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 properties grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter-grammars/tree-sitter-properties"
upstream_commit = "579b62f5ad8d96c2bb331f07d1408c92767531d9"
upstream_version = "0.3.0"
upstream_crate = "tree-sitter-properties"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-properties.git"
revision = "579b62f5ad8d96c2bb331f07d1408c92767531d9"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate properties"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
]
language = "properties"
