language = "jsdoc"
crate = "tree-sitter-kat-parsers"
upstream_repo = "https://github.com/tree-sitter/tree-sitter-jsdoc"
upstream_commit = "658d18dcdddb75c760363faa4963427a7c6b52db"
upstream_version = "0.25.0"
license = "MIT"

[copied]
files = ["grammar.js", "scanner.c", "LICENSE"]

[generated]
command = "cargo run -p xtask -- generate jsdoc"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c", "scanner.c"]

[sync]
repository = "https://github.com/tree-sitter/tree-sitter-jsdoc.git"
revision = "658d18dcdddb75c760363faa4963427a7c6b52db"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"LICENSE" = "LICENSE"
