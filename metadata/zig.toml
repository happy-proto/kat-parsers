language = "zig"
crate = "tree-sitter-kat-parsers"
reason_category = "上游 parser 依赖统一迁入 kat-parsers"
reason = "保留锁定版本的上游 zig grammar、scanner 与必要支持文件，并纳入统一 parser crate，避免 Kat 单独维护第三方 Rust parser 依赖。"
upstream_repo = "https://github.com/tree-sitter-grammars/tree-sitter-zig"
upstream_commit = "b670c8df85a1568f498aa5c8cae42f51a90473c0"
upstream_version = "1.1.2"
upstream_crate = "tree-sitter-zig"
license = "MIT"

[sync]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-zig.git"
revision = "b670c8df85a1568f498aa5c8cae42f51a90473c0"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"LICENSE" = "LICENSE"

[copied]
files = [
  "grammar.js",
  "LICENSE",
]

[generated]
command = "cargo run -p xtask -- generate zig"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
]
language = "zig"
