language = "typst"
crate = "tree-sitter-kat-parsers"
reason_category = "当前继续 vendored，主要是为了沿用上游 grammar 源和仓库内 query 集成资产"

[copied]
files = [
  "grammar.js",
  "scanner.c",
  "unicode.h",
]

[generated]
command = "cargo run -p xtask -- generate typst"
outputs = [
  ".parser-inputs",
  "grammar.json",
  "node-types.json",
  "parser.c",
  "scanner.c",
  "unicode.h",
]

[sync]
repository = "https://github.com/uben0/tree-sitter-typst"
revision = "46cf4ded12ee974a70bf8457263b67ad7ee0379d"
reference = "HEAD"

[sync.files]
"grammar.js" = "grammar.js"
"scanner.c" = "src/scanner.c"
"unicode.h" = "src/unicode.h"
