language = "csh"
crate = "tree-sitter-kat-parsers"
reason_category = "仓库内自维护 grammar"
reason = "现有社区 tcsh grammar 仅覆盖占位字符串；按 tcsh 官方手册独立实现 C shell / tcsh 源码高亮语法。"
reference_repo = "https://github.com/tcsh-org/tcsh"
reference_commit = "b7db07931546178c4cb2542b5fc850c483628ed5"
reference_files = ["tcsh.man.in"]
reference_docs = "https://www.tcsh.org/tcsh.html/top.html"
license = "MIT"

[copied]
files = ["grammar.js"]

[generated]
command = "cargo run -p xtask -- generate csh"
outputs = [".parser-inputs", "grammar.json", "node-types.json", "parser.c"]

[sync]
local = true
